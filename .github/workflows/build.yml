name: Build APK

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Create vX.Y.Z tag + GitHub Release, then bump version"
        type: boolean
        default: true
      bump:
        description: "Version bump type for the next version"
        type: choice
        default: patch
        options: [patch, minor, major]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: false

      - name: Cache CI signing key
        uses: actions/cache@v4
        with:
          path: keystore-ci.jks
          key: opencode-signing-key-v1

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            cat > keystore.properties <<EOF
            storeFile=keystore.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
            echo "Using configured signing secrets."
          else
            PASS="opencode-ci-signing"
            if [ ! -f keystore-ci.jks ]; then
              keytool -genkeypair -v \
                -keystore keystore-ci.jks -alias opencode \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" \
                -dname "CN=opencode-android, OU=Android, O=berkchy, L=Internet, ST=Internet, C=XX"
              echo "Generated fresh CI signing key."
            else
              echo "Restored cached CI signing key."
            fi
            cat > keystore.properties <<EOF
            storeFile=keystore-ci.jks
            storePassword=$PASS
            keyAlias=opencode
            keyPassword=$PASS
            EOF
            echo "keystore.properties:"
            cat keystore.properties
          fi

      - name: Build Debug + Release APKs
        run: |
          VER="$VERSION"
          MAJOR=${VER%%.*}
          REST=${VER#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          VCODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          gradle assembleDebug assembleRelease \
            -PversionName="$VER" -PversionCode="$VCODE" --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-debug-${{ env.VERSION }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-release-${{ env.VERSION }}-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Tag + GitHub Release + bump version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -e
          VER="$VERSION"
          TAG="v$VER"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping release"
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "opencode $TAG" \
            --notes "opencode-android build $TAG"

          NEW=$(python3 - "$VER" <<'PY'
          import sys
          parts = [int(x) for x in sys.argv[1].split('.')]
          bump = __import__('os').environ.get('BUMP', 'patch')
          if bump == 'major':
              parts = [parts[0] + 1, 0, 0]
          elif bump == 'minor':
              parts = [parts[0], parts[1] + 1, 0]
          else:
              parts = [parts[0], parts[1], parts[2] + 1]
          print('.'.join(str(x) for x in parts))
          PY
          )
          echo "$NEW" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $NEW"
          git push origin "${GITHUB_REF_NAME}"
          echo "Released $TAG; next version: $NEW"